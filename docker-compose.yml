# Solo para desarrollo local. Publica PostgreSQL únicamente en 127.0.0.1.
services:
  db:
    image: postgres:17-alpine
    container_name: cuidagro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuidagro
      POSTGRES_PASSWORD: cuidagro_dev
      POSTGRES_DB: cuidagro
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cuidagro_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuidagro -d cuidagro"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cuidagro_pgdata:
